<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기억 서랍</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #F2F4F3;
    --panel: #FFFFFF;
    --ink: #17211D;
    --ink-soft: #5A6663;
    --line: #DDE3E0;
    --pine: #2E6B50;
    --pine-soft: #E4EFE9;
    --amber: #8A6A2F;
    --amber-soft: #F3ECDD;
    --slate: #44566B;
    --slate-soft: #E5EAF0;
    --mono: "SF Mono", "D2Coding", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 28px 32px 18px;
    display: flex; align-items: center; gap: 14px;
  }
  header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  header p { color: var(--ink-soft); font-size: 13px; }
  .session-info {
    margin-left: auto; display: none; align-items: center; gap: 8px;
    color: var(--ink-soft); font-size: 11.5px;
  }
  .session-info.show { display: flex; }
  .session-user { font-weight: 650; color: var(--ink); }
  .session-role {
    padding: 2px 6px; border-radius: 4px; background: var(--slate-soft);
    color: var(--slate); font-family: var(--mono); font-size: 10px; font-weight: 700;
  }
  .logout-button, .activity-button {
    border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
    border-radius: 6px; padding: 5px 8px; font-size: 11px; cursor: pointer;
  }
  .activity-button:hover { border-color: var(--pine); color: var(--pine); }
  .logout-button:hover { border-color: #D8B7B1; color: #8C3B2E; }
  .role-hidden { display: none !important; }
  main {
    display: grid;
    grid-template-columns: minmax(340px, 460px) 1fr;
    gap: 20px;
    padding: 0 32px 32px;
    max-width: 1280px;
    align-items: start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .panel-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-head b { font-size: 14px; font-weight: 700; }
  .panel-head span { font-size: 12px; color: var(--ink-soft); }
  .chat-head-actions { display: flex; align-items: center; gap: 10px; }
  .chat-clear {
    border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
    border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
  }
  .chat-clear:hover { color: #8C3B2E; border-color: #D8B7B1; }

  /* ---- ingest ---- */
  textarea {
    width: 100%; border: none; resize: vertical;
    min-height: 220px; padding: 16px 18px;
    font: 14px/1.6 "Pretendard Variable", sans-serif;
    color: var(--ink); background: transparent; outline: none;
  }
  textarea::placeholder { color: #A6B0AC; }
  .ingest-foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; border-top: 1px solid var(--line);
  }
  .hint { font-size: 12px; color: var(--ink-soft); }
  button.save {
    background: var(--pine); color: #fff; border: none;
    padding: 9px 22px; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.save:disabled { opacity: .5; cursor: default; }
  button.save:focus-visible, .ask-bar button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #saveResult { padding: 0 18px; }
  .save-ok {
    margin: 12px 0; padding: 10px 14px; border-radius: 8px;
    background: var(--pine-soft); color: var(--pine);
    font-size: 13px; font-weight: 500;
  }
  .save-err { background: #F7E4E1; color: #8C3B2E; }

  /* ---- recent list ---- */
  #recent { margin-top: 20px; }
  .mem {
    padding: 12px 18px; border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .mem:first-of-type { border-top: none; }
  .mem .txt { flex: 1; font-size: 13px; line-height: 1.55; color: var(--ink); }
  .mem .txt small { display: block; color: var(--ink-soft); margin-top: 3px; font-size: 11.5px; }
  .mem button {
    border: none; background: none; color: #B9C2BE;
    cursor: pointer; font-size: 15px; padding: 2px 4px;
  }
  .mem button:hover { color: #8C3B2E; }
  .mem-actions { display: flex; flex-direction: column; gap: 3px; }
  .mem-actions button.edit:hover { color: var(--pine); }
  .chip {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    padding: 3px 8px; border-radius: 5px; white-space: nowrap; margin-top: 1px;
  }
  .chip.slack { background: var(--slate-soft); color: var(--slate); }
  .chip.email { background: var(--amber-soft); color: var(--amber); }
  .chip.note  { background: var(--pine-soft); color: var(--pine); }
  .mem.expired .txt { color: #A6B0AC; }
  .badge-exp {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; margin-left: 6px;
    background: #F7E4E1; color: #8C3B2E;
  }
  .badge-until {
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-soft); margin-left: 6px;
  }
  button.clean {
    border: 1px solid var(--line); background: #fff; color: #8C3B2E;
    font-size: 11.5px; font-weight: 600; padding: 4px 10px;
    border-radius: 6px; cursor: pointer;
  }
  button.clean:hover { background: #F7E4E1; }
  .tagbar {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
  }
  .tagbar:empty { display: none; }
  .tag {
    font-size: 11.5px; font-weight: 600; cursor: pointer;
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
  }
  .tag:hover { border-color: var(--pine); color: var(--pine); }
  .tag.on { background: var(--pine); border-color: var(--pine); color: #fff; }
  .mem-tags { display: inline; }
  .mem-tags i {
    font-style: normal; font-size: 10.5px; color: var(--pine);
    background: var(--pine-soft); padding: 1px 6px; border-radius: 4px; margin-left: 4px;
  }
  .section-tabs {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    border-bottom: 1px solid var(--line); background: #fff;
  }
  .section-tabs button {
    min-width: 0; border: none; border-right: 1px solid var(--line); background: #fff;
    padding: 9px 4px; color: var(--ink-soft); font-size: 11px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .section-tabs button:last-child { border-right: none; }
  .section-tabs button.on { background: var(--pine-soft); color: var(--pine); }
  .access-details {
    flex: 1; display: grid; grid-template-columns: 1fr; gap: 5px;
    font-size: 12px; line-height: 1.45; min-width: 0;
  }
  .access-title { font-size: 13px; font-weight: 700; color: var(--ink); }
  .access-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 7px; }
  .access-row b { color: var(--ink-soft); font-weight: 600; }
  .access-row code, .access-row a {
    color: var(--ink); font-family: var(--mono); font-size: 11px;
    overflow-wrap: anywhere; text-decoration: none;
  }
  .access-row a:hover { color: var(--pine); text-decoration: underline; }
  .filters {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: #FAFBFA;
  }
  .filters select, .filters input {
    min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 9px; background: #fff; color: var(--ink);
    font: 12px "Pretendard Variable", sans-serif; outline: none;
  }
  .filters select:focus, .filters input:focus { border-color: var(--pine); }
  .filter-dates { display: grid; grid-column: 1 / -1; grid-template-columns: 1fr 1fr; gap: 6px; }
  .filter-actions { display: flex; align-items: center; justify-content: flex-end; }
  .filter-actions button {
    border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
    border-radius: 6px; padding: 7px 10px; font-size: 11.5px; cursor: pointer;
  }
  .date-group {
    padding: 9px 18px; border-top: 1px solid var(--line); background: #F7F9F8;
    color: var(--ink-soft); font-size: 11px; font-weight: 700;
  }
  .more-wrap { padding: 10px 18px 14px; border-top: 1px solid var(--line); }
  .more-wrap button {
    width: 100%; border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
    border-radius: 6px; padding: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .more-wrap button:hover { border-color: var(--pine); color: var(--pine); }
  .status-badge {
    display: inline-block; margin-left: 5px; padding: 1px 5px; border-radius: 4px;
    background: var(--slate-soft); color: var(--slate); font-size: 10px; font-weight: 600;
  }

  /* ---- login ---- */
  #loginOverlay {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: var(--bg);
    align-items: center; justify-content: center;
  }
  #loginOverlay.show { display: flex; }
  .login-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 32px 36px; width: min(360px, 90vw); text-align: center;
  }
  .login-card h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .login-card p { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .login-card input {
    width: 100%; border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 14px; font: 14px "Pretendard Variable", sans-serif;
    outline: none; margin-bottom: 12px;
  }
  .login-card input:focus { border-color: var(--pine); }
  .login-card button {
    width: 100%; background: var(--pine); color: #fff; border: none;
    padding: 11px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .login-err { color: #8C3B2E; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ---- edit ---- */
  #editOverlay {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(23, 33, 29, .45); align-items: center; justify-content: center;
    padding: 20px;
  }
  #editOverlay.show { display: flex; }
  .edit-dialog {
    width: min(680px, 100%); max-height: calc(100vh - 40px); overflow-y: auto;
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
  }
  .edit-form { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .edit-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .edit-field.full { grid-column: 1 / -1; }
  .edit-field label { color: var(--ink-soft); font-size: 11px; font-weight: 600; }
  .edit-field input, .edit-field select, .edit-field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px;
    color: var(--ink); background: #fff; font: 13px "Pretendard Variable", sans-serif;
    outline: none;
  }
  .edit-field textarea { min-height: 180px; resize: vertical; }
  .edit-field input:focus, .edit-field select:focus, .edit-field textarea:focus { border-color: var(--pine); }
  .edit-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 16px; }
  .edit-actions button { border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .edit-actions .cancel { background: #fff; color: var(--ink-soft); }
  .edit-actions .confirm { background: var(--pine); border-color: var(--pine); color: #fff; }

  /* ---- audit log ---- */
  #auditOverlay {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(23, 33, 29, .45); align-items: center; justify-content: center;
    padding: 20px;
  }
  #auditOverlay.show { display: flex; }
  .audit-dialog {
    width: min(920px, 100%); max-height: calc(100vh - 40px); overflow: hidden;
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column;
  }
  .dialog-close {
    border: none; background: transparent; color: var(--ink-soft); cursor: pointer;
    font-size: 20px; line-height: 1; padding: 2px 4px;
  }
  .dialog-close:hover { color: var(--ink); }
  .audit-table-wrap { overflow: auto; }
  .audit-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .audit-table th, .audit-table td {
    padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left;
    vertical-align: top;
  }
  .audit-table th {
    position: sticky; top: 0; background: #F7F9F8; color: var(--ink-soft);
    font-size: 11px; font-weight: 700;
  }
  .audit-table td:nth-child(1), .audit-table td:nth-child(2), .audit-table td:nth-child(3) { white-space: nowrap; }
  .audit-table code { font: 10.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .audit-status { padding: 24px 18px; color: var(--ink-soft); font-size: 13px; text-align: center; }

  /* ---- chat ---- */
  #chat {
    display: flex; flex-direction: column;
    height: calc(100vh - 130px); min-height: 480px;
  }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 11px 15px; border-radius: 12px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .answer { white-space: normal; }
  .answer h3 { margin: 12px 0 5px; font-size: 14px; font-weight: 750; color: var(--ink); }
  .answer h3:first-child { margin-top: 0; }
  .answer p { margin: 0 0 6px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer ul { margin: 2px 0 10px; padding-left: 19px; }
  .answer li { margin: 3px 0; }
  .answer strong { font-weight: 750; color: var(--ink); }
  .answer.streaming::after {
    content: ""; display: inline-block; width: 2px; height: 1em;
    margin-left: 3px; vertical-align: -2px; background: var(--pine);
    animation: blink .8s step-end infinite;
  }
  .msg.bot .srcs { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
  .srcs .chip { cursor: pointer; border: none; }
  .raw {
    display: none; margin-top: 8px; padding: 10px 12px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all; color: var(--ink);
  }
  .raw.open { display: block; }
  .raw b { display: block; font-family: "Pretendard Variable", sans-serif; font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
  .empty { color: var(--ink-soft); font-size: 13.5px; text-align: center; margin: auto; line-height: 1.8; }
  .ask-bar { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .ask-bar input {
    flex: 1; border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 14px; font: 14px "Pretendard Variable", sans-serif; outline: none;
  }
  .ask-bar input:focus { border-color: var(--pine); }
  .ask-bar button {
    background: var(--ink); color: #fff; border: none; border-radius: 9px;
    min-width: 76px; padding: 0 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .ask-bar button:disabled { opacity: .55; cursor: wait; }
  .thinking { color: var(--ink-soft); font-size: 13px; align-self: flex-start; padding: 4px 2px; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; padding: 0 16px 24px; }
    header { padding: 20px 16px 14px; flex-wrap: wrap; }
    header p { order: 3; width: 100%; }
    .session-info { margin-left: auto; }
    #chat { height: auto; min-height: 420px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .msg { animation: rise .18s ease-out; }
    @keyframes rise { from { transform: translateY(4px); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  }
</style>
</head>
<body>

<div id="loginOverlay" class="show" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <form class="login-card" id="loginForm">
    <h2 id="loginTitle">기억 서랍</h2>
    <p>계정으로 로그인하면 열려요</p>
    <label class="sr-only" for="usernameBox">아이디 또는 이메일</label>
    <input type="text" id="usernameBox" name="username" placeholder="아이디 또는 이메일" autocomplete="username" required>
    <label class="sr-only" for="pwBox">비밀번호</label>
    <input type="password" id="pwBox" name="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">열기</button>
    <div class="login-err" id="loginErr" role="alert" aria-live="polite"></div>
  </form>
</div>

<header>
  <h1>기억 서랍</h1>
  <p>Slack·메일·메모를 붙여넣어 저장하고, 나중에 물어보세요</p>
  <div class="session-info" id="sessionInfo" aria-label="현재 로그인 정보">
    <span class="session-user" id="sessionUser"></span>
    <span class="session-role" id="sessionRole"></span>
    <button type="button" class="activity-button role-hidden" id="auditLogBtn">활동 로그</button>
    <button type="button" class="logout-button" id="logoutBtn">로그아웃</button>
  </div>
</header>

<main>
  <section>
    <div class="panel role-hidden" id="ingestPanel">
      <div class="panel-head"><b>넣기</b><span>붙여넣으면 자동으로 분류·저장돼요</span></div>
      <textarea id="pasteBox" placeholder="Slack 스레드, 메일 본문, 또는 그냥 메모를 여기에 붙여넣기&#10;&#10;예)&#10;김철수  오후 2:31&#10;다음주 배포는 수요일로 확정입니다&#10;박영희  오후 2:33&#10;스테이징 검증은 화요일까지 완료할게요"></textarea>
      <div id="saveResult" role="status" aria-live="polite"></div>
      <div class="ingest-foot">
        <span class="hint">Ctrl/⌘ + Enter로 저장</span>
        <button class="save" id="saveBtn" onclick="ingest()">저장하기</button>
      </div>
    </div>

    <div class="panel" id="recent">
      <div class="panel-head"><b>최근 저장</b>
        <span style="display:flex;align-items:center;gap:10px">
          <span id="memCount"></span>
          <button id="cleanBtn" class="clean" onclick="cleanExpired()" style="display:none">만료 정리</button>
        </span>
      </div>
      <div class="section-tabs" id="sectionTabs">
        <button class="on" data-section="" onclick="setSection('', this)">전체</button>
        <button data-section="work" onclick="setSection('work', this)">업무</button>
        <button data-section="access" onclick="setSection('access', this)">계정·접속</button>
        <button data-section="resources" onclick="setSection('resources', this)">자료·강의</button>
        <button data-section="notes" onclick="setSection('notes', this)">메모</button>
      </div>
      <div class="tagbar" id="tagBar"></div>
      <div class="filters">
        <select id="personFilter" aria-label="담당자"><option value="">담당자 전체</option></select>
        <select id="projectFilter" aria-label="프로젝트"><option value="">프로젝트 전체</option></select>
        <select id="statusFilter" aria-label="상태"><option value="">상태 전체</option></select>
        <div class="filter-actions"><button onclick="resetFilters()">필터 초기화</button></div>
        <div class="filter-dates">
          <input id="dateFrom" type="date" aria-label="시작일">
          <input id="dateTo" type="date" aria-label="종료일">
        </div>
      </div>
      <div id="memList"></div>
      <div class="more-wrap" id="moreWrap" style="display:none">
        <button onclick="showMore()">더 보기</button>
      </div>
    </div>
  </section>

  <section class="panel" id="chat">
    <div class="panel-head"><b>묻기</b><div class="chat-head-actions"><span>저장된 내용에서만 답해요</span><button class="chat-clear" onclick="clearChat()">대화 지우기</button></div></div>
    <div id="log" aria-live="polite">
      <div class="empty">아직 대화가 없어요.<br>왼쪽에 저장한 내용에 대해 무엇이든 물어보세요.</div>
    </div>
    <div class="ask-bar">

      <button id="askBtn" onclick="ask()">질문</button>
    </div>
  </section>
</main>

    <div class="edit-form">
      <div class="edit-field full"><label for="editContent">본문</label><textarea id="editContent"></textarea></div>

      <div class="edit-field"><label for="editStatus">상태</label><select id="editStatus"><option>할 일</option><option>진행 중</option><option>완료</option><option>보류</option><option>참고</option></select></div>
      <div class="edit-field"><label for="editType">유형</label><select id="editType"><option value="work">업무</option><option value="credential">서비스 계정</option><option value="system">서버·개발 환경</option><option value="link">자료·링크</option><option value="course">강의 과정</option><option value="note">메모</option></select></div>

      <button type="button" class="dialog-close" id="auditCloseBtn" aria-label="활동 로그 닫기">×</button>

      <table class="audit-table">
        <thead><tr><th>사용자</th><th>작업</th><th>일시</th><th>상세</th></tr></thead>

<script>
const $ = id => document.getElementById(id);
const chipName = { slack: "SLACK", email: "MAIL", note: "MEMO" };
const allowedRoles = new Set(["admin", "editor", "viewer"]);
let currentSession = null;

async function apiFetch(input, init) {
  const response = await fetch(input, init);
  if (response.status === 401) {
    showLogin();
    throw new Error("로그인 세션이 만료되었습니다. 다시 로그인하세요.");
  }
  return response;
}

function sourceKey(value) {
  const key = String(value || "").toLowerCase();
  return Object.hasOwn(chipName, key) ? key : "note";
}

function sourceLabel(value) {
  return chipName[sourceKey(value)];
}

function canWrite() {
  return currentSession && ["admin", "editor"].includes(currentSession.role);
}

function isAdmin() {
  return currentSession && currentSession.role === "admin";
}

function showSaveResult(message, isError = false) {
  const result = $("saveResult");
  result.replaceChildren();
  if (!message) return;
  const notice = document.createElement("div");
  notice.className = `save-ok${isError ? " save-err" : ""}`;
  notice.textContent = message;
  result.appendChild(notice);
}

async function ingest() {
  if (!canWrite()) return;
  const text = $("pasteBox").value.trim();
  if (!text) return;
  const btn = $("saveBtn");
  btn.disabled = true; btn.textContent = "저장 중…";
  showSaveResult("");
  try {
    const r = await apiFetch("/api/ingest", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    const contentType = r.headers.get("content-type") || "";
    const d = contentType.includes("application/json")
      ? await r.json()
      : { detail: await r.text() || `서버 오류 (${r.status})` };
    if (!r.ok) throw new Error(d.detail || "저장 실패");
    showSaveResult(
      `${sourceLabel(d.source)}로 인식 · ${Number(d.saved) || 0}개 조각으로 저장했어요${d.replaced ? ` (기존 ${Number(d.replaced) || 0}건 갱신)` : ""}`
    );
    $("pasteBox").value = "";
    filtersLoaded = false;
    loadRecent();
  } catch (e) {
    showSaveResult(`저장 실패: ${e.message}`, true);
  } finally {
    btn.disabled = false; btn.textContent = "저장하기";
  }
}

$("pasteBox").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ingest();
});

let activeTag = null;
let activeSection = "";
let filtersLoaded = false;
let visibleLimit = 10;
let memoryById = new Map();
let editingMemoryId = null;

function optionHtml(value) {
  return `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`;
}

async function loadFilters() {
  const r = await apiFetch("/api/memory-filters");
  if (!r.ok) return;
  const data = await r.json();
  $("personFilter").innerHTML = `<option value="">담당자 전체</option>${data.people.map(optionHtml).join("")}`;
  $("projectFilter").innerHTML = `<option value="">프로젝트 전체</option>${data.projects.map(optionHtml).join("")}`;
  $("statusFilter").innerHTML = `<option value="">상태 전체</option>${data.statuses.map(optionHtml).join("")}`;
  filtersLoaded = true;
}

function memoryParams() {
  const params = new URLSearchParams({ limit: "200" });
  const entries = {
    person: $("personFilter").value,
    project: $("projectFilter").value,
    status: $("statusFilter").value,
    section: activeSection,
    date_from: $("dateFrom").value,
    date_to: $("dateTo").value,
  };
  Object.entries(entries).forEach(([key, value]) => value && params.set(key, value));
  return params;
}

function extractField(content, names) {
  const lines = String(content).split(/\r?\n/).map(line => line.trim());
  for (const line of lines) {
    for (const name of names) {
      const match = line.match(new RegExp(`^${name}\\s*:\\s*(.+)$`, "i"));
      if (match) return match[1].trim();
    }
  }
  return "";
}

function accessDetails(m, meta) {
  const service = extractField(m.content, ["서비스명", "제목"]) || meta.project || "접속 정보";
  const url = extractField(m.content, ["URL", "호스트"]);
  const id = extractField(m.content, ["아이디", "ID"]);
  const password = extractField(m.content, ["비밀번호", "PW", "임시PW"]);
  const urlValue = /^https?:\/\//i.test(url)
    ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>`
    : `<code>${escapeHtml(url || "미기재")}</code>`;
  return `<div class="access-details">
    <div class="access-title">${escapeHtml(service)}</div>
    <div class="access-row"><b>URL</b>${urlValue}</div>
    <div class="access-row"><b>ID</b><code>${escapeHtml(id || "미기재")}</code></div>
    <div class="access-row"><b>비밀번호</b><code>${escapeHtml(password || "미기재")}</code></div>
  </div>`;
}

async function loadRecentUnsafe() {
  if (!filtersLoaded) await loadFilters();
  const [r, tr] = await Promise.all([
    apiFetch(`/api/memories?${memoryParams()}`),
    apiFetch("/api/tags"),
  ]);
  if (!r.ok || !tr.ok) throw new Error("저장된 기억을 불러오지 못했습니다.");
  const items = await r.json();
  const tags = await tr.json();
  memoryById = new Map(items.map(item => [item.id, item]));

  const visibleTags = tags.slice(0, 12);
  $("tagBar").innerHTML = visibleTags.map((t, index) =>
    `<button type="button" class="tag${t.tag === activeTag ? " on" : ""}" data-tag-index="${index}" aria-pressed="${t.tag === activeTag}">${escapeHtml(t.tag)} ${escapeHtml(t.count)}</button>`
  ).join("");
  $("tagBar").querySelectorAll("[data-tag-index]").forEach(button => {
    button.addEventListener("click", () => {
      const tag = visibleTags[Number(button.dataset.tagIndex)];
      if (tag) filterTag(tag.tag);
    });
  });

  const shown = activeTag
    ? items.filter(m => ((m.metadata || {}).tags || []).includes(activeTag))
    : items;

  const visibleItems = shown.slice(0, visibleLimit);
  $("memCount").textContent = shown.length
    ? `${Math.min(visibleLimit, shown.length)}/${shown.length}건` : "";
  const now = Date.now();
  const expiredCount = shown.filter(m =>
    m.expires_at && new Date(m.expires_at).getTime() < now
  ).length;
  let previousDate = null;
  $("memList").innerHTML = visibleItems.length ? visibleItems.map(m => {
    const meta = m.metadata || {};
    const who = meta.person || meta.sender || meta.subject || meta.channel || "";
    const workDate = meta.work_date || m.created_at.slice(0, 10);
    const savedDate = new Date(m.created_at).toLocaleDateString("ko-KR");
    const dateHeader = workDate !== previousDate
      ? `<div class="date-group">${escapeHtml(workDate)} 업무</div>` : "";
    previousDate = workDate;
    const exp = m.expires_at ? new Date(m.expires_at) : null;
    const isExpired = exp && exp.getTime() < now;
    const badge = isExpired
      ? `<span class="badge-exp">만료됨</span>`
      : exp ? `<span class="badge-until">~${exp.getMonth() + 1}/${exp.getDate()}</span>` : "";
    const tagHtml = (meta.tags || []).length
      ? `<span class="mem-tags">${(meta.tags || []).map(t => `<i>${escapeHtml(t)}</i>`).join("")}</span>` : "";
    const statusHtml = meta.status ? `<span class="status-badge">${escapeHtml(meta.status)}</span>` : "";
    const project = meta.project ? ` · ${escapeHtml(meta.project)}` : "";
    const isAccess = ["credential", "system"].includes(meta.record_type);
    const body = isAccess ? accessDetails(m, meta) : `<div class="txt">${escapeHtml(m.content.slice(0, 90))}${m.content.length > 90 ? "…" : ""}
        <small>${escapeHtml(who)}${project}${who || project ? " · " : ""}${savedDate} 저장${statusHtml}${badge}${tagHtml}</small></div>`;
    const memoryId = escapeHtml(m.id);
    const actions = [
      canWrite() ? `<button type="button" class="edit" title="수정" aria-label="기억 수정" data-memory-action="edit" data-memory-id="${memoryId}">✎</button>` : "",
      isAdmin() ? `<button type="button" title="삭제" aria-label="기억 삭제" data-memory-action="delete" data-memory-id="${memoryId}">×</button>` : "",
    ].filter(Boolean).join("");
    const source = sourceKey(m.source);
    return `${dateHeader}<div class="mem${isExpired ? " expired" : ""}">
      <span class="chip ${source}">${escapeHtml(sourceLabel(source))}</span>
      ${body}
      ${actions ? `<div class="mem-actions">${actions}</div>` : ""}
    </div>`;
  }).join("") : `<div class="mem"><div class="txt" style="color:var(--ink-soft)">${activeTag ? "이 태그의 기억이 없어요." : "저장된 기억이 아직 없어요."}</div></div>`;
  $("cleanBtn").style.display = isAdmin() && expiredCount ? "" : "none";
  $("cleanBtn").textContent = `만료 정리 (${expiredCount})`;
  $("moreWrap").style.display = shown.length > visibleLimit ? "" : "none";
}

$("memList").addEventListener("click", event => {
  const button = event.target.closest("[data-memory-action]");
  if (!button || !$("memList").contains(button)) return;
  const id = button.dataset.memoryId;
  if (button.dataset.memoryAction === "edit" && canWrite()) openEdit(id);
  if (button.dataset.memoryAction === "delete" && isAdmin()) del(id);
});

async function loadRecent() {
  try {
    await loadRecentUnsafe();
  } catch (error) {
    if (!currentSession) return;
    memoryById.clear();
    $('memCount').textContent = '';
    $('tagBar').replaceChildren();
    const row = document.createElement('div');
    row.className = 'mem';
    const message = document.createElement('div');
    message.className = 'txt';
    message.style.color = 'var(--ink-soft)';
    message.textContent = error.message || '저장된 기억을 불러오지 못했습니다.';
    row.appendChild(message);
    $('memList').replaceChildren(row);
  }
}

function filterTag(tag) {
  activeTag = (activeTag === tag) ? null : tag;
  visibleLimit = 10;
  loadRecent();
}

function setSection(section, button) {
  activeSection = section;
  visibleLimit = 10;
  $("sectionTabs").querySelectorAll("button").forEach(item => item.classList.remove("on"));
  button.classList.add("on");
  loadRecent();
}

function showMore() {
  visibleLimit += 10;
  loadRecent();
}

function resetFilters() {
  ["personFilter", "projectFilter", "statusFilter", "dateFrom", "dateTo"].forEach(id => $(id).value = "");
  activeTag = null;
  activeSection = "";
  visibleLimit = 10;
  $("sectionTabs").querySelectorAll("button").forEach(item =>
    item.classList.toggle("on", item.dataset.section === "")
  );
  loadRecent();
}

["personFilter", "projectFilter", "statusFilter", "dateFrom", "dateTo"].forEach(id =>
  $(id).addEventListener("change", () => {
    visibleLimit = 10;
    loadRecent();
  })
);

async function cleanExpired() {
  try {
    if (!isAdmin()) return;
    if (!confirm("만료된 기억을 모두 삭제할까요?")) return;
    const r = await apiFetch("/api/memories/expired", { method: "DELETE" });
    const d = await r.json();
    if (!r.ok) return alert(d.detail || "만료 기억 정리에 실패했습니다.");
    alert(`${d.deleted}건 삭제했어요.`);
    loadRecent();
  } catch (error) {
    if (currentSession) alert(error.message || "만료 기억 정리에 실패했습니다.");
  }
}

async function del(id) {
  try {
    if (!isAdmin()) return;
    if (!confirm("이 기억을 삭제할까요?")) return;
    const response = await apiFetch(`/api/memories/${id}`, { method: "DELETE" });
    if (!response.ok) {
      const data = await response.json();
      return alert(data.detail || "기억 삭제에 실패했습니다.");
    }
    loadRecent();
  } catch (error) {
    if (currentSession) alert(error.message || "기억 삭제에 실패했습니다.");
  }
}

function openEdit(id) {
  if (!canWrite()) return;
  const memory = memoryById.get(id);
  if (!memory) return;
  const meta = memory.metadata || {};
  editingMemoryId = id;
  $("editContent").value = memory.content || "";
  $("editPerson").value = meta.person || meta.sender || "";
  $("editProject").value = meta.project || "";
  $("editStatus").value = meta.status || "참고";
  $("editType").value = meta.record_type || "note";
  $("editWorkDate").value = meta.work_date || "";
  $("editDueDate").value = meta.due_date || "";
  $("editCategory").value = meta.category || "";
  $("editTags").value = (meta.tags || []).join(", ");
  $("editOverlay").classList.add("show");
  $("editContent").focus();
}

function closeEdit() {
  editingMemoryId = null;
  $("editOverlay").classList.remove("show");
}

async function saveEdit() {
  if (!editingMemoryId || !canWrite()) return;
  const content = $("editContent").value.trim();
  if (!content) return alert("본문을 입력하세요.");
  const button = $("editSaveBtn");
  button.disabled = true;
  button.textContent = "저장 중…";
  try {
    const response = await apiFetch(`/api/memories/${editingMemoryId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content,
        metadata: {
          person: $("editPerson").value.trim(),
          project: $("editProject").value.trim(),
          status: $("editStatus").value,
          record_type: $("editType").value,
          work_date: $("editWorkDate").value || null,
          due_date: $("editDueDate").value || null,
          category: $("editCategory").value.trim(),
          tags: $("editTags").value.split(",").map(tag => tag.trim()).filter(Boolean),
        },
      }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "수정 실패");
    closeEdit();
    filtersLoaded = false;
    await loadRecent();
  } catch (error) {
    if (currentSession) alert(`수정 실패: ${error.message}`);
  } finally {
    button.disabled = false;
    button.textContent = "저장";
  }
}

function auditValue(value, fallback = "-") {
  if (value === null || value === undefined || value === "") return fallback;
  if (typeof value === "string") return value;
  try {
    return JSON.stringify(value, null, 2);
  } catch (_) {
    return String(value);
  }
}

function appendAuditCell(row, value, asCode = false) {
  const cell = document.createElement("td");
  const content = asCode ? document.createElement("code") : document.createElement("span");
  content.textContent = auditValue(value);
  cell.appendChild(content);
  row.appendChild(cell);
}

async function openAuditLog() {
  if (!isAdmin()) return;
  const overlay = $("auditOverlay");
  const rows = $("auditRows");
  const status = $("auditStatus");
  rows.replaceChildren();
  status.textContent = "활동 로그를 불러오는 중입니다.";
  overlay.classList.add("show");
  $("auditCloseBtn").focus();

  try {
    const response = await apiFetch("/api/audit-logs?limit=100");
    if (!response.ok) {
      const raw = await response.text();
      let detail = `활동 로그를 불러오지 못했습니다. (${response.status})`;
      try { detail = JSON.parse(raw).detail || detail; } catch (_) {}
      throw new Error(detail);
    }
    const entries = await response.json();
    if (!Array.isArray(entries) || !entries.length) {
      status.textContent = "기록된 활동이 없습니다.";
      return;
    }

    const fragment = document.createDocumentFragment();
    entries.forEach(entry => {
      const row = document.createElement("tr");
      appendAuditCell(row, entry && entry.actor);
      appendAuditCell(row, entry && entry.action);
      const rawDate = entry && entry.created_at;
      const parsedDate = rawDate ? new Date(rawDate) : null;
      const displayedDate = parsedDate && !Number.isNaN(parsedDate.getTime())
        ? parsedDate.toLocaleString("ko-KR") : rawDate;
      appendAuditCell(row, displayedDate);
      appendAuditCell(row, entry && entry.details, true);
      fragment.appendChild(row);
    });
    rows.appendChild(fragment);
    status.textContent = "";
  } catch (error) {
    status.textContent = error.message;
  }
}

function closeAuditLog() {
  const wasOpen = $("auditOverlay").classList.contains("show");
  $("auditOverlay").classList.remove("show");
  if (wasOpen && isAdmin()) $("auditLogBtn").focus();
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && $("editOverlay").classList.contains("show")) closeEdit();
  if (event.key === "Escape" && $("auditOverlay").classList.contains("show")) closeAuditLog();
});

function addMsg(cls, html) {
  const empty = $("log").querySelector(".empty");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

const CHAT_STORAGE_KEY = "memory-agent-chat-v1";
const CHAT_OWNER_KEY = 'memory-agent-chat-owner-v1';
let chatHistory = loadChatHistory();
let chatRendered = false;

function loadChatHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || "[]");
    return Array.isArray(saved) ? saved.slice(-12) : [];
  } catch (_) {
    return [];
  }
}

function saveChatHistory() {
  localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatHistory.slice(-12)));
}

function botMessageHtml(answer, sources = []) {
  let html = `<div class="answer">${renderAnswerMarkdown(answer)}</div>`;
  const safeSources = Array.isArray(sources) ? sources : [];
  if (safeSources.length) {
    html += `<div class="srcs">` + safeSources.map((s, i) => {
      const source = sourceKey(s && s.source);
      return `<button type="button" class="chip ${source}" data-source-index="${i}" aria-expanded="false">${escapeHtml(sourceLabel(source))} · 원문</button>`;
    }
    ).join("") + `</div>`;
    html += safeSources.map((s, i) =>
      `<div class="raw" data-raw="${i}"><b>원문 그대로 (${escapeHtml(sourceLabel(s && s.source))})</b>${escapeHtml(s && s.content || "")}</div>`
    ).join("");
  }
  return html;
}

function renderAnswerMarkdown(text) {
  const lines = String(text).split(/\r?\n/);
  const parts = [];
  let listOpen = false;
  const closeList = () => {
    if (listOpen) {
      parts.push("</ul>");
      listOpen = false;
    }
  };
  const inline = value => escapeHtml(value)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) {
      closeList();
      continue;
    }
    if (line.startsWith("### ")) {
      closeList();
      parts.push(`<h3>${inline(line.slice(4))}</h3>`);
    } else if (line.startsWith("- ")) {
      if (!listOpen) {
        parts.push("<ul>");
        listOpen = true;
      }
      parts.push(`<li>${inline(line.slice(2))}</li>`);
    } else {
      closeList();
      parts.push(`<p>${inline(line)}</p>`);
    }
  }
  closeList();
  return parts.join("");
}

function renderChatHistory() {
  if (chatRendered) return;
  chatRendered = true;
  chatHistory.forEach(message => {
    if (message.role === "user") addMsg("user", escapeHtml(message.content));
    if (message.role === "assistant") {
      addMsg("bot", botMessageHtml(message.content, message.sources || []));
    }
  });
}

function resetChatView() {
  const empty = document.createElement('div');
  empty.className = 'empty';
  empty.textContent = '아직 대화가 없어요. 저장한 내용에 대해 무엇이든 물어보세요.';
  $('log').replaceChildren(empty);
}

function clearChat() {
  if (!chatHistory.length || confirm("대화 이력을 모두 지울까요?")) {
    chatHistory = [];
    localStorage.removeItem(CHAT_STORAGE_KEY);
    $("log").innerHTML = `<div class="empty">아직 대화가 없어요.<br>왼쪽에 저장한 내용에 대해 무엇이든 물어보세요.</div>`;
  }
}

async function readNdjson(response, onEvent) {
  if (!response.body) throw new Error("이 브라우저에서는 스트리밍을 사용할 수 없습니다.");
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    const lines = buffer.split("\n");
    buffer = lines.pop() || "";
    for (const line of lines) {
      if (line.trim()) onEvent(JSON.parse(line));
    }
    if (done) break;
  }
  if (buffer.trim()) onEvent(JSON.parse(buffer));
}

let isAsking = false;

async function ask() {
  const input = $("askBox");
  const button = $("askBtn");
  const q = input.value.trim();
  if (!q || isAsking) return;

  isAsking = true;
  $("log").setAttribute("aria-busy", "true");
  input.value = "";
  input.disabled = true;
  button.disabled = true;
  button.textContent = "답변 중";
  addMsg("user", escapeHtml(q));

  const bot = addMsg("bot", '<div class="answer streaming"><p>기억을 찾는 중…</p></div>');
  const answerNode = bot.querySelector(".answer");
  let answer = "";
  let sources = [];
  let completed = false;

  try {
    const response = await apiFetch("/api/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, history: chatHistory }),
    });
    if (!response.ok) {
      const raw = await response.text();
      let detail = raw || `서버 오류 (${response.status})`;
      try { detail = JSON.parse(raw).detail || detail; } catch (_) {}
      throw new Error(detail);
    }

    await readNdjson(response, event => {
      if (event.type === "meta") sources = event.sources || [];
      if (event.type === "delta") {
        answer += event.content || "";
        answerNode.innerHTML = renderAnswerMarkdown(answer);
        $("log").scrollTop = $("log").scrollHeight;
      }
      if (event.type === "error") throw new Error(event.detail || "스트리밍이 중단됐습니다.");
      if (event.type === "done") completed = true;
    });

    if (!completed) throw new Error("답변 스트리밍이 완료되지 않았습니다.");
    bot.innerHTML = botMessageHtml(answer, sources);
    chatHistory.push(
      { role: "user", content: q },
      { role: "assistant", content: answer, sources },
    );
    if (chatHistory.length > 12) chatHistory = chatHistory.slice(-12);
    saveChatHistory();
  } catch (error) {
    const partial = answer ? `${renderAnswerMarkdown(answer)}<p>응답 중단: ${escapeHtml(error.message)}</p>`
      : `<p>오류가 발생했어요: ${escapeHtml(error.message)}</p>`;
    bot.innerHTML = `<div class="answer">${partial}</div>`;
  } finally {
    isAsking = false;
    $("log").setAttribute("aria-busy", "false");
    input.disabled = false;
    button.disabled = false;
    button.textContent = "질문";
    if (currentSession) input.focus();
  }
}

function toggleRaw(chip, i) {
  const msg = chip.closest(".msg");
  const raw = msg.querySelector(`[data-raw="${i}"]`);
  if (raw) {
    const isOpen = raw.classList.toggle("open");
    chip.setAttribute("aria-expanded", String(isOpen));
  }
}

$("log").addEventListener("click", event => {
  const chip = event.target.closest("[data-source-index]");
  if (!chip || !$("log").contains(chip)) return;
  toggleRaw(chip, Number(chip.dataset.sourceIndex));
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function doLogin() {
  const username = $("usernameBox").value.trim();
  const pw = $("pwBox").value;
  if (!username || !pw) return;
  const button = $("loginBtn");
  button.disabled = true;
  button.textContent = "확인 중";
  $("loginErr").textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password: pw })
    });
    if (!r.ok) {
      const raw = await r.text();
      let detail = "사용자명 또는 비밀번호가 맞지 않아요.";
      try { detail = JSON.parse(raw).detail || detail; } catch (_) {}
      throw new Error(detail);
    }
    if (!await loadSession()) throw new Error("로그인 세션을 확인하지 못했습니다.");
    $("loginOverlay").classList.remove("show");
    $("pwBox").value = "";
    await loadRecent();
    renderChatHistory();
  } catch (error) {
    $("loginErr").textContent = error.message;
    $("pwBox").value = "";
    $("pwBox").focus();
  } finally {
    button.disabled = false;
    button.textContent = "열기";
  }
}

function applySession(data) {
  const user = data && data.user || {};
  const role = allowedRoles.has(user.role) ? user.role : "viewer";
  currentSession = { username: String(user.username || "사용자"), role };
  const chatOwner = localStorage.getItem(CHAT_OWNER_KEY);
  if (chatOwner !== currentSession.username) {
    localStorage.removeItem(CHAT_STORAGE_KEY);
    chatHistory = [];
    chatRendered = false;
    resetChatView();
  }
  localStorage.setItem(CHAT_OWNER_KEY, currentSession.username);
  const roleNames = { admin: "관리자", editor: "편집자", viewer: "조회자" };
  $("sessionUser").textContent = currentSession.username;
  $("sessionRole").textContent = roleNames[role];
  $("sessionRole").title = `권한: ${roleNames[role]}`;
  $("sessionInfo").classList.add("show");
  $("loginOverlay").classList.remove("show");
  $("ingestPanel").classList.toggle("role-hidden", !canWrite());
  $("editSaveBtn").classList.toggle("role-hidden", !canWrite());
  $("auditLogBtn").classList.toggle("role-hidden", !isAdmin());
  if (!canWrite()) closeEdit();
  if (!isAdmin()) closeAuditLog();
}

function showLogin() {
  currentSession = null;
  chatHistory = [];
  chatRendered = false;
  localStorage.removeItem(CHAT_STORAGE_KEY);
  localStorage.removeItem(CHAT_OWNER_KEY);
  resetChatView();
  filtersLoaded = false;
  memoryById.clear();
  $('memList').replaceChildren();
  $('tagBar').replaceChildren();
  $('memCount').textContent = '';
  $('pasteBox').value = '';
  $('askBox').value = '';
  showSaveResult('');
  closeEdit();
  closeAuditLog();
  $('editSaveBtn').classList.add('role-hidden');
  $("sessionInfo").classList.remove("show");
  $("auditLogBtn").classList.add("role-hidden");
  $("ingestPanel").classList.add("role-hidden");
  $("cleanBtn").style.display = "none";
  $("loginOverlay").classList.add("show");
  $("loginErr").textContent = "";
  requestAnimationFrame(() => $("usernameBox").focus());
}

async function loadSession() {
  try {
    const response = await fetch("/api/session");
    if (!response.ok) return false;
    applySession(await response.json());
    return true;
  } catch (_) {
    return false;
  }
}

async function logout() {
  $("logoutBtn").disabled = true;
  try {
    await fetch("/api/logout", { method: "POST" });
  } finally {
    chatHistory = [];
    chatRendered = false;
    localStorage.removeItem(CHAT_STORAGE_KEY);
    memoryById.clear();
    $("memList").replaceChildren();
    $("tagBar").replaceChildren();
    clearChat();
    $("usernameBox").value = "";
    $("pwBox").value = "";
    $("logoutBtn").disabled = false;
    showLogin();
  }
}

$("loginForm").addEventListener("submit", event => {
  event.preventDefault();
  doLogin();
});
$("logoutBtn").addEventListener("click", logout);
$("auditLogBtn").addEventListener("click", openAuditLog);
$("auditCloseBtn").addEventListener("click", closeAuditLog);
$("auditOverlay").addEventListener("click", event => {
  if (event.target === $("auditOverlay")) closeAuditLog();
});

async function init() {
  if (!await loadSession()) {
    showLogin();
    return;
  }
  await loadRecent();
  renderChatHistory();
}

init();
</script>
